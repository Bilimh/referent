        // Remplir la liste déroulante des élèves
        const eleveSelect = document.getElementById('eleveSelect');
        Object.keys(ELEVES).sort().forEach(nom => {
            const option = document.createElement('option');
            option.value = nom;
            option.textContent = nom;
            eleveSelect.appendChild(option);
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function afficherReferents(eleveNom) {
            const container = document.getElementById('carteReferent');
            
            if (!eleveNom) {
                container.innerHTML = `
                    <div class="p-8 text-center text-gray-400 text-sm">
                        <i class="fas fa-hand-pointer mr-2"></i> Sélectionnez un élève pour voir ses référents
                    </div>
                `;
                return;

                        <i class="fas fa-exclamation-triangle mr-2"></i> Élève non trouvé
