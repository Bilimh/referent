        // Construction automatique des listes par professeur
        const profsGenerauxListe = [...new Set(Object.values(ELEVES).map(e => e.profGeneral))];
        const profsProListe = [...new Set(Object.values(ELEVES).map(e => e.profPro))];
        
        const PROFS_GENERAUX = {};
        profsGenerauxListe.forEach(prof => {
            PROFS_GENERAUX[prof] = {
                eleves: Object.keys(ELEVES).filter(nom => ELEVES[nom].profGeneral === prof)
            };
        });
        
        const PROFS_PRO = {};
        profsProListe.forEach(prof => {
            PROFS_PRO[prof] = {
                eleves: Object.keys(ELEVES).filter(nom => ELEVES[nom].profPro === prof)
            };
        });

        let typeActif = null;
        let profActuel = null;

        function getInfoEleve(nom) {
            return ELEVES[nom];
        }

        function mettreAJourSelect() {
            const select = document.getElementById('profSelect');
            select.innerHTML = '<option value="">-- Choisissez un enseignant --</option>';
            
            if (typeActif === 'general') {
                Object.keys(PROFS_GENERAUX).forEach(prof => {
                    let opt = document.createElement('option');
                    opt.value = prof;
                    opt.textContent = prof;
                    select.appendChild(opt);
                });
            } else if (typeActif === 'pro') {
                Object.keys(PROFS_PRO).forEach(prof => {
                    let opt = document.createElement('option');
                    opt.value = prof;
                    opt.textContent = prof;
                    select.appendChild(opt);
                });
            }
            
            if (profActuel && [...select.options].some(opt => opt.value === profActuel)) {
                select.value = profActuel;
            } else {
                select.value = "";
                profActuel = null;
            }
            
            raffraichirAffichage();
        }

        function getElevesParProf(type, profNom) {
            if (type === 'general') {
                return PROFS_GENERAUX[profNom]?.eleves || [];
            } else {
                return PROFS_PRO[profNom]?.eleves || [];
            }
        }

        function raffraichirAffichage() {
            const container = document.getElementById('listeEleves');
            
            if (!typeActif || !profActuel) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm bg-white rounded-2xl shadow-sm">
                    <i class="fas fa-hand-pointer mr-2"></i> Choisissez un type puis un professeur
                </div>`;
                return;
            }
            
            const eleves = getElevesParProf(typeActif, profActuel);
            
            if (eleves.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm bg-white rounded-2xl shadow-sm">
                    <i class="fas fa-user-slash mr-2"></i> Aucun élève pour ce professeur
                </div>`;
                return;
            }
            
            // Déterminer quel type de professeur on AFFICHE (l'inverse de celui qui filtre)
            const afficherGeneral = (typeActif === 'pro'); // Si filtre Pro, on affiche le Général
            const afficherPro = (typeActif === 'general'); // Si filtre Général, on affiche le Pro
            
            let html = '';
            for (let eleve of eleves) {
                const infos = getInfoEleve(eleve);
                
                html += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden w-full">
                        <div class="p-5">
                            <div class="font-bold text-gray-800 text-lg mb-3">
                                <i class="fas fa-user-graduate text-indigo-500 mr-2"></i> ${escapeHtml(eleve)}
                            </div>
                            <div class="space-y-2">
                          <div class="flex items-center gap-3">
                                <i class="fas fa-phone-alt text-gray-400 w-5"></i>
                                ${infos.telephone !== "Non renseigné" && infos.telephone !== " " && infos.telephone !== "" ? 
                                    `<a href="tel:${infos.telephone.replace(/[^0-9+]/g, '')}" class="text-blue-600 font-mono underline hover:text-blue-800">
                                        ${infos.telephone}
                                    </a>` : 
                                    `<span class="text-gray-700 font-mono">${infos.telephone}</span>`
                                }
                            </div>
                                ${afficherGeneral ? `
                                <div class="flex items-center gap-3 flex-wrap">
                                    <i class="fas fa-chalkboard-user text-blue-500 w-5"></i>
                                    <span class="text-gray-600 text-sm"><span class="font-medium">Ens. Général :</span> ${escapeHtml(infos.profGeneral)}</span>
                                </div>
                                ` : ''}
                                ${afficherPro ? `
                                <div class="flex items-center gap-3 flex-wrap">
                                    <i class="fas fa-tools text-green-500 w-5"></i>
                                    <span class="text-gray-600 text-sm"><span class="font-medium">Ens. Pro :</span> ${escapeHtml(infos.profPro)}</span>
                                </div>
                                ` : ''}
                                <div class="flex items-start gap-3">
                                    <i class="fas fa-map-marker-alt text-red-400 w-5 mt-0.5"></i>
                                    ${infos.adresse !== " " && infos.adresse !== "Non renseignée" ? 
                                        `<a href="https://maps.google.com/?q=${encodeURIComponent(infos.adresse)}" target="_blank" rel="noopener noreferrer" class="text-indigo-600 text-sm flex-1 hover:underline">
                                            ${escapeHtml(infos.adresse)}
                                        </a>` : 
                                        `<span class="text-gray-600 text-sm flex-1">${escapeHtml(infos.adresse)}</span>`
                                    }
                                </div>
                                                            </div>
                        </div>
                        <div class="h-1 bg-gradient-to-r from-indigo-100 to-transparent"></div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function setType(type) {
            typeActif = type;
            profActuel = null;
            
            const btnGen = document.getElementById('btnGeneral');
            const btnPro = document.getElementById('btnPro');
            
            if (type === 'general') {
                btnGen.className = "flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-indigo-600 text-white shadow-md active:scale-95";
                btnPro.className = "flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-gray-100 text-gray-600 border border-gray-200 active:scale-95";
            } else if (type === 'pro') {
                btnPro.className = "flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-indigo-600 text-white shadow-md active:scale-95";
                btnGen.className = "flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-gray-100 text-gray-600 border border-gray-200 active:scale-95";
            }
            
            mettreAJourSelect();
        }
        
        function resetFiltres() {
            typeActif = null;
            profActuel = null;
            
            document.getElementById('btnGeneral').className = "flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-gray-100 text-gray-600 border border-gray-200 active:scale-95";
            document.getElementById('btnPro').className = "flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-gray-100 text-gray-600 border border-gray-200 active:scale-95";
            
            const select = document.getElementById('profSelect');
            select.innerHTML = '<option value="">-- Choisissez un enseignant --</option>';
            select.value = "";
            
            document.getElementById('listeEleves').innerHTML = `<div class="p-8 text-center text-gray-400 text-sm bg-white rounded-2xl shadow-sm">
                <i class="fas fa-hand-pointer mr-2"></i> Sélectionnez un type puis un professeur
            </div>`;
        }
        
        function bindEvents() {
            document.getElementById('btnGeneral').addEventListener('click', () => setType('general'));
            document.getElementById('btnPro').addEventListener('click', () => setType('pro'));
            document.getElementById('resetBtn').addEventListener('click', resetFiltres);
            
            const select = document.getElementById('profSelect');
            select.addEventListener('change', (e) => {
                profActuel = e.target.value || null;
                raffraichirAffichage();
            });
        }
        
        bindEvents();
        resetFiltres();
    </script>
