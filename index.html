<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Suivi Stage - Référents</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fb; }
        .card:active { transform: scale(0.99); transition: transform 0.05s; }
    </style>
</head>
<body class="p-4 pb-20">

    <div class="max-w-xl mx-auto">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">📋 Suivi stage</h1>
            <p class="text-gray-400 text-sm mt-0.5">Élèves et numéro tuteur</p>
        </div>

        <!-- Filtres -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-5">
            <!-- Boutons Général / Pro -->
            <div class="flex gap-3 mb-5">
                <button id="btnGeneral" class="flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-gray-100 text-gray-600 border border-gray-200 active:scale-95">
                    🎓 Général
                </button>
                <button id="btnPro" class="flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-gray-100 text-gray-600 border border-gray-200 active:scale-95">
                    🔧 Professionnel
                </button>
            </div>

            <!-- Sélecteur professeur -->
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-400 uppercase tracking-wide mb-2">Professeur</label>
                <select id="profSelect" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-gray-800 text-base focus:ring-2 focus:ring-indigo-300 focus:border-indigo-300 outline-none">
                    <option value="">-- Choisissez un enseignant --</option>
                </select>
            </div>

            <button id="resetBtn" class="w-full py-2.5 text-sm text-gray-500 bg-gray-50 rounded-xl border border-gray-200 active:bg-gray-100 transition">
                ✖️ Réinitialiser
            </button>
        </div>

        <!-- Liste des élèves -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-5 py-3 bg-white border-b border-gray-100 flex justify-between items-center">
                <span class="text-sm font-semibold text-gray-700">👨‍🎓 Élèves</span>
                <span id="compteur" class="bg-indigo-50 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-full">0</span>
            </div>
            <div id="listeEleves" class="divide-y divide-gray-50">
                <div class="p-8 text-center text-gray-400 text-sm">
                    Sélectionnez un type puis un professeur
                </div>
            </div>
        </div>
    </div>

    <script>
        // --------------------------------------------------------------
        // DONNÉES ÉLÈVES (depuis ton CSV)
        // --------------------------------------------------------------
        const elevesNoms = [
            "ABOURY OCCULI Heureuse Nihrole", "ACHAMMAMI Jawed", "ASSONG NTARY Alexia", "BELDJOUHAR Zeyd",
            "BOUJDIF Yassin", "BOUKLATA Augustin", "BOULOUH Néjima", "CHAABI EL BAGHDADI Islam",
            "CHERGUI Fatima Zahra", "COULIBALY Houraye", "DEWIT Mathias", "DIAKITE Naya",
            "GAROSHVILI Mariam", "KERE Anne", "KHANFAR Celia", "KHLYSTUNOV Anatolii",
            "KRIBA Nawel", "LAGHMICH Nadia", "LOUAFI Mahidinne", "MAMELEYEN KAZE Edwin Efren",
            "MESSAOUDI Sofiane", "MILLIMONO Djenabou", "NYEMBA Rhema", "PRETE Flavia",
            "RIGA Madyson", "SECK Soukeyna", "SERRAI Chiraz", "ZAHABU Jennie", "ZOUGHAIB Jean-Paul"
        ];

        // 5 profs généraux (SANS parenthèses)
        const PROFS_GENERAUX = [
            "Mme Martin",
            "M. Dupont",
            "Mme Laurent",
            "M. Bernard",
            "Mme Petit"
        ];

        // 3 profs pro (SANS parenthèses)
        const PROFS_PRO = [
            "M. Moreau",
            "Mme Dubois",
            "M. Leroy"
        ];

        // Générer numéro de tuteur aléatoire
        function genererTel() {
            let debut = Math.random() < 0.5 ? "06" : "07";
            let num = debut;
            for (let i = 0; i < 8; i++) num += Math.floor(Math.random() * 10);
            return num.replace(/(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/, "$1 $2 $3 $4 $5");
        }

        // Assignation aléatoire pour chaque élève
        let elevesData = [];

        function initData() {
            elevesData = elevesNoms.map(nom => ({
                nom: nom,
                profGeneral: PROFS_GENERAUX[Math.floor(Math.random() * PROFS_GENERAUX.length)],
                profPro: PROFS_PRO[Math.floor(Math.random() * PROFS_PRO.length)],
                telTuteur: genererTel()
            }));
        }

        // État du filtre
        let typeActif = null;      // 'general' ou 'pro'
        let profActuel = null;

        // Mettre à jour la dropdown
        function mettreAJourSelect() {
            const select = document.getElementById('profSelect');
            select.innerHTML = '<option value="">-- Choisissez un enseignant --</option>';
            
            if (typeActif === 'general') {
                PROFS_GENERAUX.forEach(p => {
                    let opt = document.createElement('option');
                    opt.value = p;
                    opt.textContent = p;
                    select.appendChild(opt);
                });
            } else if (typeActif === 'pro') {
                PROFS_PRO.forEach(p => {
                    let opt = document.createElement('option');
                    opt.value = p;
                    opt.textContent = p;
                    select.appendChild(opt);
                });
            }
            
            // Restaurer la sélection si possible
            if (profActuel && [...select.options].some(opt => opt.value === profActuel)) {
                select.value = profActuel;
            } else {
                select.value = "";
                profActuel = null;
            }
            
            raffraichirAffichage();
        }

        // Récupérer les élèves filtrés
        function getElevesFiltres() {
            if (!typeActif || !profActuel) return [];
            
            return elevesData.filter(eleve => {
                if (typeActif === 'general') {
                    return eleve.profGeneral === profActuel;
                } else {
                    return eleve.profPro === profActuel;
                }
            });
        }
        
        // Affichage : on montre l'AUTRE professeur (pas celui qui est connecté)
        function raffraichirAffichage() {
            const container = document.getElementById('listeEleves');
            const compteurSpan = document.getElementById('compteur');
            const elevesFiltres = getElevesFiltres();
            
            if (!typeActif || !profActuel || elevesFiltres.length === 0) {
                if (typeActif && profActuel) {
                    container.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm">Aucun élève pour ce professeur</div>`;
                } else {
                    container.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm">👈 Choisissez un type et un professeur</div>`;
                }
                compteurSpan.innerText = '0';
                return;
            }
            
            let html = '';
            for (let eleve of elevesFiltres) {
                // L'autre professeur (pas celui qui filtre)
                const autreProf = (typeActif === 'general') ? eleve.profPro : eleve.profGeneral;
                const labelAutre = (typeActif === 'general') ? '🔧 Référent Pro' : '🎓 Référent Général';
                
                html += `
                    <div class="card p-4 hover:bg-gray-50 transition">
                        <div class="flex justify-between items-start gap-3">
                            <div class="flex-1">
                                <div class="font-bold text-gray-800 text-base">${escapeHtml(eleve.nom)}</div>
                                <div class="mt-2 flex flex-wrap items-center gap-x-2 gap-y-1">
                                    <span class="text-xs text-gray-400">${labelAutre}</span>
                                    <span class="text-sm font-medium text-gray-700">${escapeHtml(autreProf)}</span>
                                </div>
                            </div>
                            <div class="bg-indigo-50 rounded-xl px-3 py-2 min-w-[100px] text-right">
                                <div class="text-xs text-gray-500">📞 Tuteur</div>
                                <div class="text-base font-mono font-bold text-indigo-700">${eleve.telTuteur}</div>
                            </div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
            compteurSpan.innerText = elevesFiltres.length;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Changement de type
        function setType(type) {
            typeActif = type;
            profActuel = null;
            
            const btnGen = document.getElementById('btnGeneral');
            const btnPro = document.getElementById('btnPro');
            
            if (type === 'general') {
                btnGen.className = "flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-indigo-600 text-white shadow-md active:scale-95";
                btnPro.className = "flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-gray-100 text-gray-600 border border-gray-200 active:scale-95";
            } else if (type === 'pro') {
                btnPro.className = "flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-indigo-600 text-white shadow-md active:scale-95";
                btnGen.className = "flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-gray-100 text-gray-600 border border-gray-200 active:scale-95";
            }
            
            mettreAJourSelect();
        }
        
        // Réinitialisation
        function resetFiltres() {
            typeActif = null;
            profActuel = null;
            
            document.getElementById('btnGeneral').className = "flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-gray-100 text-gray-600 border border-gray-200 active:scale-95";
            document.getElementById('btnPro').className = "flex-1 py-3 rounded-xl font-semibold text-base transition-all bg-gray-100 text-gray-600 border border-gray-200 active:scale-95";
            
            const select = document.getElementById('profSelect');
            select.innerHTML = '<option value="">-- Choisissez un enseignant --</option>';
            select.value = "";
            
            document.getElementById('listeEleves').innerHTML = `<div class="p-8 text-center text-gray-400 text-sm">Sélectionnez un type puis un professeur</div>`;
            document.getElementById('compteur').innerText = '0';
        }
        
        // Événements
        function bindEvents() {
            document.getElementById('btnGeneral').addEventListener('click', () => setType('general'));
            document.getElementById('btnPro').addEventListener('click', () => setType('pro'));
            document.getElementById('resetBtn').addEventListener('click', resetFiltres);
            
            const select = document.getElementById('profSelect');
            select.addEventListener('change', (e) => {
                profActuel = e.target.value || null;
                raffraichirAffichage();
            });
        }
        
        // Initialisation
        initData();
        bindEvents();
        resetFiltres();
    </script>
</body>
</html>
